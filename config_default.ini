[GENERAL]
; Artificial latency to inject (in milliseconds) 
; Applied once before YOLO processing and once before MAVLink transmission
ARTIFICIAL_LATENCY_MS = 0

; If true, logs every single detection and its confidence to the terminal.
LOG_ALL_DETECTIONS = true

; CONNECTOR_TYPE : str
; The type of connector to use for transmission of commands.
; Available options:
;    'VISION_HUB' : Use the VOXL Vision Hub to transmit commands to PX4.
;    'PX4' : Use the MAVLink protocol to transmit commands directly to PX4.
CONNECTOR_TYPE = VISION_HUB

; YOLO_MODE : str
; The YOLO mode to use for object detection.
; Available options:
;    'voxl-tflite-server' : Use the onboard VOXL TFLite server for object detection.
;    'python' : Run YOLO detection in Python on the host computer.
YOLO_MODE = voxl-tflite-server

[VISIONHUB]
; Used if CONNECTOR_TYPE = VISION_HUB
DRONE_IP = 192.168.8.1
TRIGGER_PORT = 5005

[PX4]
; PX4_ADDRESS : str
; The address of the remote system. If None, it will default to
; udpin: //0.0.0.0:14540.
;
; Supported URL formats:
;         - Serial: serial: ///path/to/serial/dev[:baudrate]
;         - UDP in: udpin: //bind_host:bind_port
;         - UDP out: udpout: //dest_host:dest_port
;         - TCP in: tcpin: //bind_host:bind_port
;         - TCP out: tcpout: //dest_host:dest_port
;
; for VOXL2 change the following lines in /etc/modalai/voxl-vision-hub.conf
;         "en_localhost_mavlink_udp": true, // false -> true
;         "localhost_udp_port_number": 14551, // set the same port bellow
ADDRESS = udpout://192.168.8.1:14550

; DETECTION_ACTION : str
; The action to take when a valid detection is received.
;
; Available actions:
;     'hold' : Switch the PX4 vehicle to Hold mode.
;     'land' : Command the vehicle to land.
;     'offboard' : Switch the PX4 vehicle to Offboard mode.
DETECTION_ACTION = hold

[TFLITE_RECEIVER]
; Used when YOLO_MODE = voxl-tflite-server
; The ROS 2 topic published by voxl_mpa_to_ros2
; This should match the "output_pipe_prefix" set in /etc/modalai/voxl-tflite-server.conf
PIPE_PREFIX = yolo

[YOLO]
; Used when YOLO_MODE = python

; RTSP_URL : str
; RTSP Camera Stream URL
RTSP_URL = rtsp://192.168.8.1:8900/live

; MODEL_PATH : str
; Path to the YOLO model file. This can be a local path or a URL.
MODEL_PATH = yolo26m.pt

; CONFIDENCE_THRESHOLD : float
; The confidence threshold for YOLO detections. Detections with confidence below this value will be ignored.
CONFIDENCE_THRESHOLD = 0.6

; DEVICE : str
; The device to use for YOLO inference. Options include 'auto', 'cpu', or specific GPU indices (e.g., '0', '1', '0,1').
; Target device: 'auto' (dynamically selects CUDA if available), 'cpu', '0', '1', or '0,1'
DEVICE = auto

; ENABLE_DEBUG_WINDOW : bool
; Display local OpenCV window on desktop (Set to false when running headless or over SSH)
ENABLE_DEBUG_WINDOW = true

; ENABLE_WEB_STREAM : bool
; Enable HTTP web stream for remote viewing in a browser
ENABLE_WEB_STREAM = false
WEB_PORT = 8080